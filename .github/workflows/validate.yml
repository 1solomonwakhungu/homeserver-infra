name: Validate infrastructure

on:
  pull_request:
  push:
    branches:
      - main
      - add-foundation
      - portfolio-polish-homeserver-infra

jobs:
  validate:
    name: Terraform and Terragrunt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.3

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: 0.63.6

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terragrunt hclfmt
        working-directory: infra
        run: terragrunt hclfmt --terragrunt-check

      - name: Terraform init module
        run: terraform -chdir=infra/modules/vm init -backend=false -input=false

      - name: Terraform validate module
        run: terraform -chdir=infra/modules/vm validate

      - name: Terragrunt validate rack stacks
        shell: bash
        run: |
          set -euo pipefail

          for stack in infra/racks/*; do
            if [[ -d "${stack}" ]]; then
              echo "::group::${stack}"
              (
                cd "${stack}"
                terragrunt init -backend=false -input=false -lockfile=readonly --terragrunt-non-interactive
                terraform fmt -check
                terragrunt validate-inputs --terragrunt-non-interactive
                terragrunt validate --terragrunt-non-interactive
              )
              echo "::endgroup::"
            fi
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: terraform-docs smoke test
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: infra/modules/vm
          output-method: stdout
          git-push: "false"
